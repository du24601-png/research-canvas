# Publish Opptrix self-host Docker image to GHCR
# Triggers: workflow_dispatch only (manual). Runtime packages use runtime-v* separately.
#
# Image: ghcr.io/<owner-lowercase>/opptrix
# Tags (same digest):
#   - opptrix-selfhost-vX.Y.Z  (matches git tag)
#   - X.Y.Z                    (semver shorthand)
#   - selfhost                 (floating latest successful self-host line)
#
# Does NOT bake LLMs into the image (entrypoint volume detection unchanged).
#
# GitHub is the single authoritative build source. Once GHCR publish succeeds,
# the sync-to-cnb job copies the SAME multi-arch image (digest unchanged) to the
# CNB registry docker.cnb.cool/travisun/opptrix. CNB-side manual channels
# (.cnb.yml) only mirror / emergency-rebuild this artifact — they never auto-build.
name: Publish selfhost image

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Base/app tag or version (e.g. opptrix-selfhost-v1.3.6 or 1.3.6)'
        required: true
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-selfhost-image-${{ inputs.tag }}
  cancel-in-progress: false

env:
  # Keep in sync with scripts/lib/ci-pins.env
  CI_UBUNTU_RUNNER: ubuntu-24.04
  OPPTRIX_NODE_PATCH_VERSION: '24.11.1'

jobs:
  build-and-push:
    name: Build & push GHCR image
    runs-on: ubuntu-24.04  # pin: scripts/lib/ci-pins.env CI_UBUNTU_RUNNER
    timeout-minutes: 120
    steps:
      - name: Resolve version tags
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          RAW="${{ inputs.tag }}"
          RAW="${RAW#refs/tags/}"
          if [[ "$RAW" == opptrix-selfhost-v* ]]; then
            FULL_TAG="$RAW"
            VERSION="${RAW#opptrix-selfhost-v}"
          elif [[ "$RAW" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-+].*)?$ ]]; then
            VERSION="$RAW"
            FULL_TAG="opptrix-selfhost-v${VERSION}"
          else
            echo "::error::Invalid tag '${RAW}'. Expect opptrix-selfhost-vX.Y.Z or X.Y.Z"
            exit 1
          fi
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-+].*)?$ ]]; then
            echo "::error::Invalid semver in '${FULL_TAG}'"
            exit 1
          fi
          OWNER_LC="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          IMAGE="ghcr.io/${OWNER_LC}/opptrix"
          echo "full_tag=${FULL_TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"
          echo "Resolved FULL_TAG=${FULL_TAG} VERSION=${VERSION} IMAGE=${IMAGE}"

      - name: Checkout app snapshot
        uses: actions/checkout@v5
        with:
          # Dispatch: checkout the resolved base tag ref.
          ref: ${{ steps.meta.outputs.full_tag }}
          fetch-depth: 1

      - name: Verify monorepo build context (no baked models)
        shell: bash
        run: |
          set -euo pipefail
          test -f Dockerfile
          test -f docker-compose.yml
          test -d apps
          test -d packages
          test -d client-ui
          # Guard: Dockerfile must not COPY large model trees into the image
          if grep -E 'COPY.*(llms|sensevoice|/models)' Dockerfile; then
            echo "::error::Dockerfile appears to COPY model paths — self-host image must stay model-free"
            exit 1
          fi
          if ! grep -q 'OPPTRIX_HOME\|OPPTRIX_MODELS_DIR\|/opptrix\|/models' scripts/docker-entrypoint.sh; then
            echo "::warning::entrypoint may not reference persistence paths — confirm volume detection still works"
          fi
          if ! grep -q 'tsconfig.base.json' Dockerfile; then
            echo "::error::Dockerfile must COPY tsconfig.base.json (packages extend it for tsc)"
            exit 1
          fi
          if ! grep -q 'opptrix-agent' Dockerfile; then
            echo "::error::Dockerfile missing opptrix-agent user (dual-user DAC)"
            exit 1
          fi
          if ! grep -q 'OPPTRIX_HOME=/opptrix' Dockerfile; then
            echo "::error::Dockerfile missing OPPTRIX_HOME=/opptrix default"
            exit 1
          fi
          if ! grep -q 'stageSeedVersionAsPending\|promote' scripts/system-boot.mjs; then
            echo "::warning::system-boot may lack image→slot promote — confirm Docker upgrade path"
          fi
          echo "Build context OK (monorepo + model-free Dockerfile + DAC + /opptrix)"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: docker_meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.meta.outputs.image }}
          tags: |
            type=raw,value=${{ steps.meta.outputs.full_tag }}
            type=raw,value=${{ steps.meta.outputs.version }}
            type=raw,value=selfhost
          labels: |
            org.opencontainers.image.title=Opptrix self-host
            org.opencontainers.image.description=Opptrix single-user self-hosted image (models via volume)
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Build and push multi-arch image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.docker_meta.outputs.tags }}
          labels: ${{ steps.docker_meta.outputs.labels }}
          # Official registries (empty prefixes) — Node 24
          build-args: |
            NODE_VERSION=${{ env.OPPTRIX_NODE_PATCH_VERSION }}
            NODE_IMAGE_PREFIX=
            NPM_REGISTRY=
            APT_MIRROR=
            OPPTRIX_BASE_VERSION=${{ steps.meta.outputs.full_tag }}
            OPPTRIX_RELEASE_TAG=${{ steps.meta.outputs.full_tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

      - name: Summarize
        shell: bash
        run: |
          echo "### Published" >> "$GITHUB_STEP_SUMMARY"
          echo "- Image: \`${{ steps.meta.outputs.image }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Tags: \`${{ steps.meta.outputs.full_tag }}\`, \`${{ steps.meta.outputs.version }}\`, \`selfhost\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Platforms: linux/amd64, linux/arm64" >> "$GITHUB_STEP_SUMMARY"
          echo "- Models: not included — download via product onboarding or set \`OPPTRIX_FETCH_MODELS_ON_START=1\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- CNB mirror: \`docker.cnb.cool/travisun/opptrix\` — same digest, synced by the sync-to-cnb job" >> "$GITHUB_STEP_SUMMARY"

  # ── CNB 制品库同步 ────────────────────────────────────────────────────────────
  # GitHub 为唯一权威构建源：GHCR 发布成功后，用 skopeo 把同一镜像（含多架构
  # manifest，digest 不变）复制到 CNB 制品库 docker.cnb.cool/travisun/opptrix。
  # CNB 侧失败不影响 GHCR 发布结果；本 job 可单独重跑（Re-run failed jobs）。
  # 共用的标签规则见 scripts/cnb/image-common.sh（CNB 手动通道同源）。
  sync-to-cnb:
    name: Sync image to CNB registry
    needs: build-and-push
    runs-on: ubuntu-24.04  # pin: scripts/lib/ci-pins.env CI_UBUNTU_RUNNER
    timeout-minutes: 30
    permissions:
      contents: read  # GHCR 公开镜像匿名拉取即可，无需 packages 权限
    env:
      # 凭据优雅降级：维护者未在 GitHub secrets 配置 CNB_REGISTRY_TOKEN 时，
      # 后续同步步骤全部跳过，job 整体成功（GHCR 发布不受影响）
      CNB_SYNC_ENABLED: ${{ secrets.CNB_REGISTRY_TOKEN != '' }}
    steps:
      - name: Resolve version tags
        id: meta
        shell: bash
        # 解析规则与 build-and-push.steps.meta 完全一致（inputs.tag 在本 job 同样可用）
        run: |
          set -euo pipefail
          RAW="${{ inputs.tag }}"
          RAW="${RAW#refs/tags/}"
          if [[ "$RAW" == opptrix-selfhost-v* ]]; then
            FULL_TAG="$RAW"
            VERSION="${RAW#opptrix-selfhost-v}"
          elif [[ "$RAW" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-+].*)?$ ]]; then
            VERSION="$RAW"
            FULL_TAG="opptrix-selfhost-v${VERSION}"
          else
            echo "::error::Invalid tag '${RAW}'. Expect opptrix-selfhost-vX.Y.Z or X.Y.Z"
            exit 1
          fi
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-+].*)?$ ]]; then
            echo "::error::Invalid semver in '${FULL_TAG}'"
            exit 1
          fi
          OWNER_LC="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          IMAGE="ghcr.io/${OWNER_LC}/opptrix"
          echo "full_tag=${FULL_TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"
          echo "Resolved FULL_TAG=${FULL_TAG} VERSION=${VERSION} IMAGE=${IMAGE}"

      - name: Notice — CNB token not configured
        if: env.CNB_SYNC_ENABLED != 'true'
        run: |
          echo "::notice::GitHub secrets 未配置 CNB_REGISTRY_TOKEN — 跳过 CNB 制品库同步（GHCR 发布不受影响）"
          {
            echo "### CNB 同步已跳过"
            echo "- 原因：维护者尚未在 GitHub secrets 配置 \`CNB_REGISTRY_TOKEN\`。"
            echo "- GHCR 为权威制品源，本次发布结果不受影响；配置后可单独重跑本 job 完成同步。"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Install skopeo
        if: env.CNB_SYNC_ENABLED == 'true'
        run: |
          set -euo pipefail
          if command -v skopeo >/dev/null 2>&1; then
            echo "skopeo already available: $(skopeo --version)"
          else
            sudo apt-get update -q
            sudo apt-get install -y -q skopeo
          fi

      - name: Log in to CNB registry
        if: env.CNB_SYNC_ENABLED == 'true'
        env:
          CNB_TOKEN: ${{ secrets.CNB_REGISTRY_TOKEN }}  # 仅经环境变量引用，不回显
        run: |
          set -euo pipefail
          printf '%s\n' "$CNB_TOKEN" | skopeo login docker.cnb.cool -u cnb --password-stdin

      - name: Copy multi-arch image to CNB
        if: env.CNB_SYNC_ENABLED == 'true'
        env:
          GHCR_IMAGE: ${{ steps.meta.outputs.image }}
          FULL_TAG: ${{ steps.meta.outputs.full_tag }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          # skopeo copy --all 复制整个多架构 manifest（digest 不变）；
          # 若 skopeo 版本对 --all 报错，可改用等价新旗标 --multi-arch all。
          for TAG in "$FULL_TAG" "$VERSION" selfhost; do
            echo "Syncing ${TAG} ..."
            skopeo copy --all --retry-times 3 \
              "docker://${GHCR_IMAGE}:${TAG}" \
              "docker://docker.cnb.cool/travisun/opptrix:${TAG}"
          done

      - name: Verify digests match
        if: env.CNB_SYNC_ENABLED == 'true'
        env:
          GHCR_IMAGE: ${{ steps.meta.outputs.image }}
          FULL_TAG: ${{ steps.meta.outputs.full_tag }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          # 用 raw manifest（多架构时为 manifest list 原始字节）的 sha256 比对源/目标 digest
          for TAG in "$FULL_TAG" "$VERSION" selfhost; do
            SRC="$(skopeo inspect --raw "docker://${GHCR_IMAGE}:${TAG}" | sha256sum | awk '{print $1}')"
            DST="$(skopeo inspect --raw "docker://docker.cnb.cool/travisun/opptrix:${TAG}" | sha256sum | awk '{print $1}')"
            if [ -z "$SRC" ] || [ "$SRC" != "$DST" ]; then
              echo "::error::Digest mismatch for '${TAG}': src=${SRC} dst=${DST}"
              exit 1
            fi
            echo "Digest OK (${TAG}): ${SRC}"
          done

      - name: Summarize CNB sync
        if: env.CNB_SYNC_ENABLED == 'true'
        env:
          FULL_TAG: ${{ steps.meta.outputs.full_tag }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          {
            echo "### CNB 镜像同步完成"
            echo "- 制品库：\`docker.cnb.cool/travisun/opptrix\`（与 GHCR 同 digest）"
            echo "- Tags: \`${FULL_TAG}\`, \`${VERSION}\`, \`selfhost\`"
            echo "- 拉取示例：\`docker pull docker.cnb.cool/travisun/opptrix:${VERSION}\`"
          } >> "$GITHUB_STEP_SUMMARY"
